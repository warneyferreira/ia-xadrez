name: Interface and report checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: node node_modules/bun/install.js
      - run: npm run typecheck
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r arena/requirements.txt
        working-directory: .
      - run: python -m unittest discover -s arena/tests -p 'test_*.py'
        working-directory: .
